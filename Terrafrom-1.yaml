1) What is a Resource Block?

A: resource block in Terraform is used to define and manage cloud resources like EC2 instances, S3 buckets, security groups, databases, etc.
It tells Terraform what to create, how to configure it, and how to track it using the state file.

Example:
  resource "aws_instance" "web_server" {
  ami           = "ami-0c55b159cbfafe1f0"
  instance_type = "t2.micro"
  tags = {
    Name = "KKFunda-Web"
  }
}



2) What is count?
A: The count is an meta-argument in Terraform allows you to create a specified number of instances of a resource or module. It's a simple way to scale out resources.

Example:          
resource "aws_instance" "server" {
  count         = 3
  ami           = "ami-0c55b159cbfafe1f0"
  instance_type = "t2.micro"

  tags = {
    Name = "Server-${count.index}"
  }
}


3) What is the for_each?
A: The for_each is an meta-argument in Terraform allows you to create a specified number of instances of a resource or module with unique names and values from a map or set of strings.

Example:
 1. Create IAM Users from a Set

 variable "username" {
    default = ["alice", "bob", "charlie"]
 }

 resource "aws_iam_user" "team_users" {
  for_each = toset(var.usernames)
  name     = each.key

  tags = {
    Team      = "DevOps"
    CreatedBy = "Terraform"
  }
}
Creates 3 IAM users with the tag Team = DevOps.
----------
2. IAM Users with Different Tags (using Map)

variable "user_map" {
  default = {
    alice   = "dev"
    bob     = "qa"
    charlie = "infra"
  }
}

resource "aws_iam_user" "department_users" {
  for_each = var.user_map
  name     = each.key

  tags = {
    Department = each.value
    CreatedBy  = "Terraform"
  }
}
-------------

4) What is provider in Terraform?
A: The provider meta-argument in Terraform is used to explicitly specify which cloud provider configuration a resource or module should use.

alias:	Required when defining multiple configurations of the same provider
provider:	Used inside resources/modules to refer to a specific alias
Why Use provider?
  * When using multiple regions
  * When using multiple AWS accounts
  * When separating resource responsibilities
  * When writing reusable modules

Example: multiple regions

provider "aws" {
  alias  = "us_east"
  region = "us-east-1"
}

provider "aws" {
  alias  = "mumbai"
  region = "ap-south-1"
}

resource "aws_instance" "east" {
  provider      = aws.us_east
  ami           = "ami-0abcdef1234567890"
  instance_type = "t2.micro"
}

resource "aws_instance" "mumbai" {
  provider      = aws.mumbai
  ami           = "ami-0abcdef1234567890"
  instance_type = "t2.micro"
}

-----------

5) What is depends_on?
A: The depends_on meta-argument is used in Terraform to explicitly declare a dependency between resources. It ensures that one resource is created only after another resource is fully created.
Terraform usually detects dependencies automatically by analyzing the configuration graph., but in some special cases, you must manually instruct Terraform on the resource creation order.

What Happens Without It?
Terraform may execute resources in parallel.
If the second resource needs the first one, it may fail or behave unpredictably.

Use Case 1: EC2 Instance Depends on Security Group

resource "aws_security_group" "allow_all" {
  name        = "allow_all"
  description = "Allow all inbound traffic"
  ingress {
    from_port   = 0
    to_port     = 0
    protocol    = "-1"
    cidr_blocks = ["0.0.0.0/0"]
  }
}

resource "aws_instance" "web" {
  ami           = "ami-0c55b159cbfafe1f0"
  instance_type = "t2.micro"

  depends_on = [aws_security_group.allow_all]
}

Use Case 2: File Generation Before Uploading to S3

terraform {
  required_providers {
    aws = {
      source  = "hashicorp/aws"
      version = "6.8.0"
    }
  }

  required_version = ">= 1.3.0"
}

provider "aws" {
  alias  = "mumbai"
  region = "ap-south-1"
}

# Create an S3 bucket
resource "aws_s3_bucket" "my_bucket" {
  provider      = aws.mumbai
  bucket        = "kkfunda-demo-bucket-12345" # use a unique name
  force_destroy = true
}

# Generate a local file (in current directory)
resource "null_resource" "generate_file" {
  provisioner "local-exec" {
    command = "echo Hello KKFunda > demo.txt"
  }
}

# Upload the file to the S3 bucket
resource "aws_s3_bucket_object" "upload_file" {
  provider = aws.mumbai
  bucket   = aws_s3_bucket.my_bucket.bucket
  key      = "demo.txt"
  source   = "${path.module}/demo.txt"

  depends_on = [null_resource.generate_file]
}

Use Case 3: Module Dependency

module "network" {
  source = "./network"
}

module "app" {
  source = "./application"

  depends_on = [module.network]
}

-----------

6)  What is lifecycle?

The lifecycle block in Terraform provides fine-grained control over how resources behave during:

Creation
Updates
Destruction
It is written inside a resource block and supports these keys:

create_before_destroy
prevent_destroy
ignore_changes

 1. create_before_destroy

✅ Use Case:
Ensure zero downtime when making changes (e.g., AMI update).

resource "aws_instance" "web_server" {
  ami           = "ami-0abcdef1234567890"
  instance_type = "t2.micro"
  key_name      = "kkfunda-key"

  lifecycle {
    create_before_destroy = true
  }
}

💬 Explanation:
“Terraform usually destroys the old EC2 before creating the new one when a change is detected. With create_before_destroy, it launches the new EC2 first, then removes the old one, ensuring no downtime during updates.”


 2. prevent_destroy

 ✅ Use Case:
Block accidental deletion of critical EC2 instances.

resource "aws_instance" "web_server" {
  ami           = "ami-0abcdef1234567890"
  instance_type = "t2.micro"
  key_name      = "kkfunda-key"

  lifecycle {
    prevent_destroy = true
  }
}
💬 Explanation:
“This is useful when a production EC2 instance must be protected. If someone tries to run terraform destroy, Terraform will throw an error unless prevent_destroy is removed.”

3. ignore_changes
✅ Use Case:
Ignore manual changes made in the AWS console for selected fields.

resource "aws_instance" "web_server" {
  ami           = "ami-0abcdef1234567890"
  instance_type = "t2.micro"
  key_name      = "kkfunda-key"

  user_data = file("setup.sh")

  tags = {
    Name = "KKFunda-EC2"
  }

  lifecycle {
    ignore_changes = [tags, user_data]
  }
}
💬 Explanation:
“Sometimes the support or operations team updates tags or user_data scripts manually in the console. We don’t want Terraform to reset them during the next apply. So, we use ignore_changes to skip those attributes.”

7) What Are Input Variables?
A: Terraform input variables allow us to customize configuration without altering code. These variables make infrastructure more reusable, modular, and scalable.

Basic Syntax
variable "variable_name" {
  type        = <type>
  description = "What this variable controls"
  default     = <optional_default_value>
  sensitive   = true|false   # optional
}

Validation Rules
Use validation block to restrict acceptable values.

Example – Instance Type:
variable "instance_type" {
  type = string

  validation {
    condition     = contains(["t2.micro", "t2.small", "t3.micro"], var.instance_type)
    error_message = "Allowed: t2.micro, t2.small, t3.micro"
  }

  default = "t2.micro"
}

Sensitive Variables
Mark variables sensitive = true to prevent them from being shown in logs or outputs.

variable "db_password" {
  type      = string
  sensitive = true
}

variable Precedence Order (Highest to Lowest):
Command line
     ↓
.tfvars
     ↓
Environment variable (TF_VAR_*)
     ↓
Default
     ↓
User prompt

8) What are Terraform workspaces?
A: Terraform Workspaces are like separate work environments within the same Terraform configuration. Workspaces allow for multiple state files to be used within a single configuration directory, useful for managing different environments (e.g., dev, staging, production).

9) What are data sources?
A: A Data Source in Terraform lets you fetch information from your infrastructure or cloud provider that you can use elsewhere in your configuration. 
For example, if you need to use the latest AMI for an EC2 instance, you can use a data source to dynamically pull that information:

data "aws_ami" "latest_ami" { 
  most_recent = true 
  owners = ["amazon"] 
  filter { 
    name = "name" 
    values = ["amzn2-ami-hvm-*-x86_64-gp2"] 
  } 
} 

resource "aws_instance" "my_instance" { 
  ami = data.aws_ami.latest_ami.id 
  instance_type = "t2.micro" 
}


10) What Are Terraform Functions?
A: Terraform functions are built-in functions that helpers to manipulate values during execution.
Used to modify strings, lists, maps, CIDR blocks, timestamps, etc.
Functions are evaluated at plan time.

Function Categories & Common Functions
Category	                          Functions
----------                          ----------------
String	                   join, split, upper, lower, trimspace, replace, format
Numeric                   	min, max, ceil, floor
Collection	               length, merge, lookup, keys, values, element, compact
CIDR/IP	                   cidrsubnet, cidrhost, cidrnetmask
Date/Time	                  timestamp(), formatdate()
Conversion	                tostring, tonumber, toset, try, coalesce, coalescelist
Encoding	                  jsonencode, jsondecode, base64encode, base64decode
Misc	                    uuid(), random_uuid()

11) What is a Dynamic Block?
A: A dynamic block is used in Terraform to dynamically generate nested blocks such as ingress, egress, tag, rule, etc., based on a variable or a list.

Dynamic blocks only work inside resource blocks.
A dynamic block lets you dynamically generate repeated nested configuration blocks using for_each.

Why it's useful:
Avoids repetitive code
Allows looping over input variables
Helps with cleaner, scalable configurations

Example: 
variable "ports" {
  default = [80, 443]
}

resource "aws_security_group" "example" {
  name = "example"

  dynamic "ingress" {
    for_each = var.ports

    content {
      from_port   = ingress.value
      to_port     = ingress.value
      protocol    = "tcp"
      cidr_blocks = ["0.0.0.0/0"]
    }
  }
}

12) What’s a Terraform State file, and why is it important? 

A: The Terraform State file (terraform.tfstate) is like Terraform’s memory. It keeps track of the real-world infrastructure you’ve deployed, mapping your configuration to 
the actual resources. Whenever you apply changes, Terraform compares your .tf files to the state file to see what’s already been deployed and what needs updating.
That’s why it’s super important to keep your state file safe and secure, especially if you’re working in a team.
Many folks use remote state backends like AWS S3 with DynamoDB for state locking to avoid conflicts.

13)  What are Terraform Modules, and why are they useful?
A: Terraform modules are reusable, self-contained packages of Terraform configurations that simplify infrastructure management. Modules enable code reusability, maintainability,
and scalability, making complex AWS deployments more efficient.
If you’re deploying the same type of resource across multiple projects, you can create a module for it. For example, you might have a module for setting up an EC2 instance
with all your standard settings. Then, instead of copying and pasting that code into every project, you just call the module.

14) How do you manage sensitive data in Terraform?
 A: Sensitive data in Terraform, like API keys or passwords, should never be hardcoded into your .tf files. Instead, you can use Terraform’s sensitive flag with variables or
 store the sensitive data in environment variables or a secrets management service like AWS Secrets Manager or HashiCorp Vault.
 Here’s how you’d define a sensitive variable: 
 variable "db_password" { 
  description = "The database password" 
  type = string 
  sensitive = true 
} 
When you mark a variable as sensitive, Terraform will hide its value in logs and outputs. It’s a simple but crucial step for keeping your infrastructure secure.

15)  What’s a Backend in Terraform, and why is it important? 
A: A Backend in Terraform determines where and how your state file is stored. By default, Terraform stores the state file locally, but in a team setting, you’ll want to store
it remotely to avoid conflicts. Popular backend options include AWS S3, Azure Blob Storage, and HashiCorp Consul. 
Here’s an example of configuring a remote backend using AWS S3:
terraform { 
 backend "s3" {  
   bucket = "my-terraform-state" 
   key = "global/s3/terraform.tfstate" 
   region = "us-west-2" 
  }
} 
This setup ensures that your state file is securely stored in S3 and is accessible to everyone on your team. It also enables state locking, so only one person can run terraform apply at a time, preventing race conditions

16) What’s Terraform Taint, and when should you use it? 
A: terraform taint is a command that marks a resource for destruction and recreation on the next terraform apply. This is useful when a resource is in a bad state, 
and you want to force Terraform to rebuild it. Here’s how you use it: 
terraform taint aws_instance.my_instance 
The next time you run terraform apply, 
Terraform will destroy the my_instance resource and create a new one. This is a handy tool for fixing issues without manually deleting resources.
while terraform untaint removes the taint, preventing the resource from being recreated.


17)  What is a null_resource in Terraform?
A: A null_resource in Terraform is a resource that doesn't create or manage any real infrastructure. It's mainly used to run provisioners or trigger actions based on changes in other resources.

It comes from the null provider.
Why would you use it?
A common use is to execute a command after another resource changes.
resource "aws_instance" "web" {
  ami           = "ami-123456"
  instance_type = "t2.micro"
}

resource "null_resource" "configure" {
  depends_on = [aws_instance.web]

  provisioner "local-exec" {
    command = "echo Server created"
  }
}

Here:

1)Terraform creates the EC2 instance.
2)Because of depends_on, Terraform waits for the instance.
3)The null_resource runs the command.

18)  What is the role of the terraform validate command?
A: erraform validate checks whether the configuration is syntactically valid and internally consistent, but it does not access any remote services.

19)What is Terraform refresh?
A: terraform refresh updates the Terraform state to reflect the current infrastructure state by querying the cloud provider.

20) What is the purpose of the terraform show command?

A:  terraform show provides detailed information about the current state of your infrastructure, including metadata, resource properties, and the state file.

21) What happens if your Terraform state file is accidentally deleted?
A: Terraform loses track of all existing resources. On the next terraform apply, it may attempt to recreate all resources, causing duplication or conflicts. You should restore the state file 
  from a backup or re-import the resources using terraform import.

22) What happens if multiple team members run terraform apply at the same time?
A: If state locking is not enabled (e.g., using DynamoDB with S3), this can corrupt the state file. Only one apply should be allowed at a time to ensure safe and consistent updates.
  Enable state locking to prevent race conditions.

23) What happens if a resource creation fails halfway through terraform apply?
A: Terraform stops the apply process immediately on failure. Successfully created resources remain, and the failed resource will
  be retried on the next apply unless fixed or removed.

24) What happens if terraform plan shows no changes but infrastructure was modified manually?
A: Terraform will not detect drift unless you run terraform refresh or terraform plan -refresh-only. This can lead to unpredictable behavior or conflicts in future applies.

25)What is state drift in Terraform? And how to resolve it?
A: State drift occurs when the actual state of your infrastructure on the cloud provider differs from what is recorded in the Terraform state file. 
  This is usually caused by manual changes made to the infrastructure outside of Terraform (e.g., through the cloud provider's console).

Resolution:

1) Run terraform plan. Terraform will detect the drift and show you the changes it wants to make to revert the manual changes.
2) To update the state file to match the real-world infrastructure, you can use terraform apply -refresh-only.
3) Alternatively, you can accept the changes proposed by terraform plan and run terraform apply to bring the infrastructure back to the state defined in your configuration.

26) What is locals in Terraform?
A: locals in Terraform are used to define reusable local values within a configuration. locals are used to run expression or functions and save the result to a variable.

Example:
 locals {
  ami_id = "ami-090252cbe067a9e58"
  sg_id = "sg-tweyyrouihrjo" #replace your sg group id
  instance_type = var.instance_name == "db" ? "t2.micro" : "t3.micro"

  tags = {
    Name = "locals"
  }
}

variable "instance_name" {
    default = "db"
}

resource "aws_instance" "db" {

    ami = local.ami_id
    vpc_security_group_ids = [local.sg_id]
    instance_type = local.instance_type
    tags = local.tags
}

  
