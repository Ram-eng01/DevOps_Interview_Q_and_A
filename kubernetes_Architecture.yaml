  A Kubernetes cluster consists of a Control Plane (API Server, Scheduler, Controller Manager, etcd) and
  multiple Worker Nodes (Kubelet, Kube Proxy, Container Runtime). The control plane manages the cluster state,
  while the worker nodes run the actual workloads (pods).

  1. Control Plane — The Brain of the Cluster

  The control plane manages and maintains the desired state of the cluster (e.g., which apps are running, what images they use, which nodes they run on, etc.).

kube-apiserver:	Entry point to the cluster. All communication (kubectl, controllers) goes through this REST API.
etcd:	Distributed key-value store for storing all cluster data (configuration, state, secrets, etc.).
kube-scheduler:	Assigns pods to nodes based on resource availability, taints/tolerations, affinities.
controller-manager:	Runs various controllers (e.g., Node, ReplicaSet, Job) to monitor and maintain the desired state.

2. Worker Nodes — Where Your Apps Run
   Worker nodes are where actual application workloads (pods) are deployed
kubelet:	Agent that runs on each node, communicates with the API server, ensures containers are running.
kube-proxy:	Manages networking rules to route traffic to the correct pod using Services.
Container Runtime:y	Responsible for running the containers (e.g., containerd, Docker, CRI-O).

  Communication Flow (Simplified)
1) You run kubectl apply -f deployment.yaml
2) kubectl talks to the kube-apiserver
3) The API server stores config/state in etcd
4) The scheduler finds the best node to place the pod
5) The kubelet on that node pulls the image and starts the container
6) kube-proxy and service route traffic to the pod



2. What is the role of kube-proxy?
A: Kube-proxy is responsible for the networking in the cluster. It maintains the network rules on the worker nodes and also responsible for the load balancing.
   This can be done by IPTables. Means if someone tries to access the service, kube-proxy will redirect the request to the appropriate POD.

3.What is Ingress?
Ingress is a Kubernetes API object that manages external HTTP and HTTPS access to services inside a cluster. It provides:

Layer 7 (HTTP/HTTPS) routing — unlike Services which are Layer 4 (TCP/UDP)
Host-based routing — api.example.com → API service, web.example.com → Web service
Path-based routing — /api → API service, /static → CDN service
TLS termination — handle SSL certificates in one place
Single entry point — one IP/LoadBalancer for many services

Component             	What it is	                                            Who manages it
Ingress Resource	      YAML object with routing rules	                        You (the developer/admin)
Ingress Controller	    Pod(s) that read rules and route traffic	              Cluster admin installs it
IngressClass	          Tells which controller handles which Ingress	           Cluster admin configures it

4. what is Custom Resource?
A: A Custom Resource Definition (CRD) in Kubernetes allows you to extend the Kubernetes API by creating your own custom resource types.
   This enables you to manage application-specific resources just like built-in Kubernetes objects such as Pods, Deployments, or Services.
   Componets:
      1) CRD ---> Customresouce Defination --> Defining a new type of API to K8s
      2) CR -----> Custom Resouce  ---> like Deployment, service 
      3) Custom Controller ----> written in Golang
